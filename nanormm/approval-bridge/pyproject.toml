[project]
name = "approval-bridge"
version = "0.1.0"
description = "FastAPI service that closes the Slack approval round-trip for trmm-mcp."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "trmm-mcp",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fakeredis>=2.21",
    "pytest-postgresql>=5",
    "respx>=0.20",
    "ruff>=0.4",
]

[tool.uv.sources]
trmm-mcp = { path = "../trmm-mcp", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["approval_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101"]  # pytest assert

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hardcoded passwords/tokens in fixtures
